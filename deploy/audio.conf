# RK-KVM audio capture config
# AUDIO_SRC : uac  = HDMI audio from the capture stick (no wiring needed)
#             alsa = board's own audio input (needs a cable from the target)
# AUDIO_DEV : ALSA capture device (only for AUDIO_SRC=alsa)
# AUDIO_RATE/AUDIO_CH: for the ALSA path
# AUDIO_ENABLE: 1 = capture audio, 0 = off
# Stream format is 16-bit little-endian PCM (UAC is 48000/2ch).
AUDIO_SRC=uac
AUDIO_DEV=hw:0,0
AUDIO_RATE=48000
AUDIO_CH=2
AUDIO_ENABLE=1
