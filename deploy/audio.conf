# RK-KVM audio capture config (ALSA)
# AUDIO_DEV : ALSA capture device (arecord -D ...)
# AUDIO_RATE: sample rate (Hz)
# AUDIO_CH  : channels
# AUDIO_ENABLE: 1 = capture audio, 0 = off
#
# Note: feed the controlled machine's audio output into the board's
# audio input (3.5mm). The stream is 16-bit little-endian PCM.
AUDIO_DEV=hw:0,0
AUDIO_RATE=48000
AUDIO_CH=2
AUDIO_ENABLE=1
